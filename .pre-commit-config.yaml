default_language_version:
  python: python3.14
exclude: ^\.claude/
repos:
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v6.0.0
  hooks:
  - id: check-added-large-files
  - id: check-toml
  - id: check-yaml
  - id: end-of-file-fixer
  - id: trailing-whitespace
  - id: check-json
  - id: detect-private-key
  - args:
    - --branch
    - main
    id: no-commit-to-branch
- repo: https://github.com/astral-sh/ruff-pre-commit
  rev: v0.16.0
  hooks:
  - id: ruff-format
  - id: ruff-check
    args:
    - --fix
- repo: local
  hooks:
  - id: mypy
    name: mypy (strict)
    entry: mypy --config-file pyproject.toml django_traceid
    language: system
    types:
    - python
    pass_filenames: false
    stages:
    - pre-push
- repo: https://github.com/chrysa/pre-commit-tools
  rev: v0.1.1-100
  hooks:
  - id: makefile-check
  - exclude: ^(\.github/|workflows/|templates/)
    id: yaml-sorter
  - id: json-sorter
  - id: env-file-check
  - id: env-example-sync
  - id: adr-gate
  - id: debugger-detection
  - id: python-print-detection
  - id: python-pprint-detection
    exclude: tests?/
  - id: no-bare-except
  - id: python-logger-detection
  - id: python-unreachable-code
  - id: no-hardcoded-localhost
    exclude: tests?/|\.test\.|\.spec\.
  - id: regression-gate
    stages:
    - pre-push
  - id: claude-skill-frontmatter
  - id: claude-agent-frontmatter
  - id: claude-mcp-config
  - id: python-no-unittest-import
  - id: claude-assets-present
- repo: https://github.com/igorshubovych/markdownlint-cli
  rev: v0.49.1
  hooks:
  - args:
    - --fix
    id: markdownlint
    stages:
    - manual
- repo: https://github.com/gitleaks/gitleaks
  rev: v8.30.1
  hooks:
  - id: gitleaks
- repo: https://github.com/compilerla/conventional-pre-commit
  rev: v4.4.0
  hooks:
  - id: conventional-pre-commit
    stages:
    - commit-msg
    args:
    - feat
    - fix
    - docs
    - style
    - refactor
    - test
    - chore
    - perf
    - revert
    - ci
- repo: https://github.com/chrysa/guideline-checker
  rev: v1.30.10
  hooks:
  - id: guideline-check