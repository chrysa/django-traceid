[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-traceid"
version = "0.1.0"
description = "Project-agnostic, end-to-end trace/request id propagation for Django (HTTP, logging, background jobs)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Anthony Gréau", email = "greau.anthony@gmail.com" }]
keywords = ["django", "logging", "tracing", "trace-id", "request-id", "observability", "loki"]
classifiers = [
    "Environment :: Web Environment",
    "Framework :: Django",
    "Framework :: Django :: 4.2",
    "Framework :: Django :: 5.0",
    "Framework :: Django :: 5.1",
    "Framework :: Django :: 5.2",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: System :: Logging",
    "Typing :: Typed",
]
dependencies = ["Django>=4.2"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.8",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11,<2.0",
    "django-stubs[compatible-mypy]>=5.0",
]

[project.urls]
Homepage = "https://github.com/chrysa/django-traceid"
Repository = "https://github.com/chrysa/django-traceid"
Issues = "https://github.com/chrysa/django-traceid/issues"

[tool.setuptools.packages.find]
where = ["src"]
include = ["django_traceid*"]

[tool.setuptools.package-data]
django_traceid = ["py.typed"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
pythonpath = [".", "src"]
testpaths = ["tests"]
addopts = "-v --tb=short --cov=django_traceid --cov-report=term-missing --cov-fail-under=85"
python_files = "test_*.py"
python_classes = "Test*"
python_functions = "test_*"

[tool.coverage.run]
source = ["django_traceid"]
omit = ["**/tests/**"]

[tool.coverage.report]
fail_under = 85
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]

[tool.ruff]
line-length = 120
indent-width = 4
target-version = "py312"
# examples/ holds illustrative demo Django apps, not library code.
extend-exclude = ["build/*", "dist/*", "*.egg-info/*", ".venv/*", "venv/*", "examples"]

[tool.ruff.lint]
# Aligned with chrysa shared-standards ruff rule set.
select = ["E", "W", "F", "I", "N", "UP", "B", "C4", "C90", "S", "DJ", "TID", "FURB", "RUF"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["S101"] # asserts are expected in tests

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true
exclude = ["tests/"]
# Enable the django-stubs plugin so Django base classes (AppConfig) and
# decorators (@receiver) resolve to real types instead of Any under strict mode.
plugins = ["mypy_django_plugin.main"]

[tool.django-stubs]
# Settings module used by the plugin to resolve Django types. Points at the
# test settings; mypy itself still excludes tests/ from checking.
django_settings_module = "tests.settings"
