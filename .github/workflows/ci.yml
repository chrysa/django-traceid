---
# Thin caller of the generalized chrysa lean CI (gate = pre-commit; reports → Sonar;
# test matrix; sonar). Auto-versioning stays in release.yml (GitVersion).

name: CI

on:
    pull_request:
        branches: [main]
    push:
        branches: [main, "feat/**", "fix/**", "chore/**", "ci/**"]
    workflow_dispatch:

permissions:
    contents: read
    checks: write
    pull-requests: write

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    ci:
        uses: chrysa/github-actions/.github/workflows/ci-python.yml@main
        with:
            package: django_traceid
            sources: "django_traceid tests"
            project-key: chrysa_django-traceid
            project-name: django-traceid
            sonar-sources: .
            typecheck-paths: django_traceid
        secrets: inherit
